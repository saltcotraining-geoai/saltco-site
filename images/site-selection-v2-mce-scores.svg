<title id="title">MCE scores for the 12 buildings in the Boolean-vs-MCE comparison</title>
<desc id="desc">Horizontal bar chart. Six buildings chosen by both methods score 0.75 to 0.98. Three MCE-only buildings score 0.675 to 0.686. Three Boolean-only buildings score 0.484 to 0.539. The MCE cut-off is after the ninth building.</desc>
